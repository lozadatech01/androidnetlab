name: Android APK (new)
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify stable package boundaries
        run: bash new/verify-package-boundaries.sh
      - name: Build new Android app
        run: gradle --no-daemon -p new assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: androidnetlab-next-debug-apk
          path: new/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
