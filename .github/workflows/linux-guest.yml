name: Linux guest image
on:
  workflow_dispatch:
  push:
    paths:
      - 'vm/**'
      - '.github/workflows/linux-guest.yml'
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc cpio file git rsync unzip wget python3 python3-pexpect qemu-system-arm
      - name: Build minimal AArch64 guest
        run: bash vm/build-guest.sh
      - name: Boot guest in QEMU and capture smoke metrics
        run: bash vm/test-guest.sh
      - name: Collect in-guest process, memory, and network diagnostics
        run: python3 vm/guest-diagnostics.py
      - name: Test isolated two-guest Ethernet and ICMP
        run: python3 vm/test-two-guest-network.py
      - name: Test multiple logical devices inside one guest
        run: python3 vm/test-single-guest-devices.py
      - name: Upload guest image and test reports
        uses: actions/upload-artifact@v4
        with:
          name: androidnetlab-linux-guest-aarch64
          path: vm/dist/*
          if-no-files-found: error
          retention-days: 14
